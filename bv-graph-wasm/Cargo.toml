[package]
name = "bv-graph-wasm"
version = "0.1.0"
edition = "2021"
authors = ["bv contributors"]
description = "High-performance graph algorithms for bv static viewer"
repository = "https://github.com/Dicklesworthstone/beads_viewer"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook", "full"]

# Core algorithms used by the viewer (required)
core = []

# Optional algorithms that can be excluded with --no-default-features --features core
eigenvector = []    # Eigenvector centrality
kcore = []          # K-core decomposition
slack = []          # Slack/float calculations
hits = []           # HITS algorithm
reachability = []   # Reachability & blocker queries

# Include all algorithms (enabled in default so viewer.js/graph.js have full parity)
full = ["core", "eigenvector", "kcore", "slack", "hits", "reachability"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize aggressively for size - critical for WASM bundles.
# Do NOT set strip = true here: Cargo stripping drops the wasm target_features
# custom section required by Binaryen wasm-opt -Os (which strips debug/name
# sections itself after validating bulk-memory instructions).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
