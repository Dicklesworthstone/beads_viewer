name: Release

# Retained as input for local DSR/act execution. GitHub Actions stays disabled.
# DSR supplies the complete gate receipt and a fresh output path outside the checkout.
env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify release toolchain
        run: bash scripts/release_gate.sh verify-toolchain
      - name: Verify release gate receipt
        run: |
          : "${RELEASE_GATE_RECEIPT:?DSR must supply a complete gate receipt}"
          : "${RELEASE_GATE_DIST:?DSR must supply a fresh external output path}"
          bash scripts/release_gate.sh verify-source
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: 'v2.18.1'
          install-only: true
      - name: Package and seal verified artifacts
        run: bash scripts/release_gate.sh package
